name: Aplicar correcciones solicitadas de CREA

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/crea-requested-update.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Reconstruir y aplicar paquete
        shell: bash
        run: |
          cat .github/crea-transfer/part-* | base64 -d > /tmp/crea-update.tgz
          echo "d15be9dd676dc8afd32d355fbf3ca8c67ae0865a32965b1f0792ba027c13072c  /tmp/crea-update.tgz" | sha256sum -c -
          tar -xzf /tmp/crea-update.tgz -C .

      - name: Validar sitio
        shell: bash
        run: |
          node scripts/check.mjs
          node --test tests/*.test.mjs
          node scripts/build.mjs

      - name: Publicar cambios y limpiar transferencia
        shell: bash
        run: |
          git config user.name "CREA Publication"
          git config user.email "actions@users.noreply.github.com"
          git rm -r .github/crea-transfer
          git add src/site tests
          git commit -m "fix: aplica ajustes visuales e interacción solicitados"
          git push
