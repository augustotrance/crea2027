name: Aplicar ajustes finales CREA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crea-final-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar y aplicar paquete
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/crea-transfer/final-b0c790a.b64 > /tmp/crea-final.tgz
          echo "58f512494b055d1614ae77242171b178e2acb62b7725cb61061da05e739e605f  /tmp/crea-final.tgz" | sha256sum -c -
          tar -xzf /tmp/crea-final.tgz
          node scripts/check.mjs
          node --test tests/*.test.mjs
          node scripts/build.mjs
          git diff --check

      - name: Publicar ajustes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/site/index.html src/site/assets/css/styles.css src/site/assets/js/main.js tests/site.test.mjs
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 1
          fi
          git commit -m "fix: simplifica casos y actualiza contacto"
          git push origin HEAD:main
